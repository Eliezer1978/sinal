name: Coleta diária

on:
  schedule:
    # O agendador do GitHub enfileira tarefas agendadas e atrasa horas em
    # momentos de pico — foi o que fez a edição das 6h chegar às 14h. Duas
    # defesas contra isso:
    #
    #   1. os minutos são quebrados, porque a fila no minuto 0 é a pior;
    #   2. há três disparos na janela da manhã, e o trabalho de verdade
    #      acontece no primeiro que conseguir rodar. Os outros conferem que
    #      a edição do dia já existe e saem em segundos, sem gastar API.
    #
    # Horários em UTC. Brasília é UTC−3 e o Brasil não usa horário de verão;
    # se voltar a usar, tire uma hora de cada linha.
    - cron: '11 8 * * *'    # 05:11 em Brasília
    - cron: '41 9 * * *'    # 06:41 em Brasília
    - cron: '11 11 * * *'   # 08:11 em Brasília
  workflow_dispatch:
    inputs:
      pular_ia:
        description: 'Rodar sem a camada de IA (sem tradução nem curadoria)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  # Decide se há trabalho a fazer. Sai em segundos quando não há.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.checar.outputs.rodar }}
    steps:
      - uses: actions/checkout@v4

      - id: checar
        name: A edição de hoje já existe?
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
            echo "Execução manual: coletando de qualquer forma." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "site/data/dias/$HOJE.json" ]; then
            echo "rodar=nao" >> "$GITHUB_OUTPUT"
            echo "### Nada a fazer" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A edição de **$HOJE** já foi publicada por um disparo anterior desta manhã." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
            echo "Ainda não há edição de $HOJE. Coletando." >> "$GITHUB_STEP_SUMMARY"
          fi

  coletar:
    needs: decidir
    if: needs.decidir.outputs.rodar == 'sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Coletar feeds
        run: node collector/collect.mjs
        env:
          WINDOW_HOURS: '48'
          PER_SOURCE_CAP: '25'
          GLOBAL_CAP: '700'

      - name: Traduzir e escrever a curadoria
        if: ${{ github.event.inputs.pular_ia != 'true' }}
        run: node collector/enrich.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Traduzir as 150 melhores em vez de 400 corta o custo diário da API
          # para cerca de um terço. As 150 primeiras já cobrem, com folga, tudo
          # o que aparece nas primeiras telas de qualquer combinação de temas;
          # o que ficar sem tradução continua aparecendo no idioma original.
          MAX_TRANSLATE: '150'

      - name: Podar o acervo além de 30 dias
        run: node collector/prune.mjs
        env:
          KEEP_DAYS: '30'

      - name: Guardar a edição no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "Nada mudou nesta coleta."
          else
            git commit -m "Edição de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Resumo
        run: |
          echo "### Edição publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Site: ${{ steps.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          node -e "
            const d = require('./site/data/latest.json');
            const l = [];
            l.push('- Matérias publicadas: **' + d.stats.publishedItems + '** (de ' + d.stats.rawItems + ' brutas)');
            l.push('- Fontes que responderam: **' + d.stats.sourcesOk + '/' + d.stats.sourcesTotal + '**');
            l.push('- Curadoria por IA: **' + (d.aiEnabled ? 'ativa' : 'desligada') + '**');
            if (d.ai) {
              l.push('- Traduzidas: **' + (d.ai.translatedCount || 0) + '**' +
                ' · modelo \`' + (d.ai.models && d.ai.models.translate) + '\`');
              l.push('- Análise do dia: ' + (d.briefing
                ? '**pronta** com \`' + (d.ai.models.briefingUsado || d.ai.models.briefing) + '\`'
                : '**falhou** — ' + (d.briefingErro || 'motivo não registrado')));
            }
            if (d.aiNote) l.push('- ' + d.aiNote);
            if (d.acervo) l.push('- Acervo: **' + d.acervo.dias.length + '** dia(s) guardado(s)');
            const down = d.sources.filter(s => !s.ok);
            if (down.length) {
              l.push('');
              l.push('<details open><summary><b>Fontes que falharam (' + down.length + ')</b></summary>');
              l.push('');
              down.forEach(s => l.push('- \`' + s.id + '\`: ' + s.error));
              l.push('');
              l.push('</details>');
            }
            const empty = d.sources.filter(s => s.ok && s.collected === 0);
            if (empty.length) {
              l.push('');
              l.push('<details open><summary><b>Responderam sem trazer nada (' + empty.length + ')</b></summary>');
              l.push('');
              l.push('| fonte | itens no feed | fora da janela | o que veio |');
              l.push('|---|---|---|---|');
              empty.forEach(s => {
                const g = s.diag || {};
                const amostra = (g.sample || '').replace(/\|/g, '/').slice(0, 90);
                l.push('| \`' + s.id + '\` | ' + (g.entries ?? '?') + ' | ' + (g.stale ?? '?') + ' | ' + amostra + ' |');
              });
              l.push('');
              l.push('</details>');
            }
            console.log(l.join('\n'));
          " >> $GITHUB_STEP_SUMMARY
