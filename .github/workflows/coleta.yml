name: Coleta diária

# Duas etapas com naturezas opostas, agora separadas.
#
#   COLETA     é gratuita (repositório público = minutos ilimitados) e é a
#              única chance de capturar aquele dia: feeds RSS são uma janela
#              móvel, o que sai deles não volta. Por isso roda todo dia.
#
#   TRADUÇÃO   é o que custa, e é adiável: a memória em data/traducoes.json
#              guarda cada tradução pelo id da matéria, então uma execução
#              posterior preenche o que faltou nos últimos dias sem deixar
#              buraco. Roda duas vezes por semana e sempre que você mandar.
#
# Em toda execução o enrich.mjs roda de algum jeito: sem a chave ele só aplica
# o que já está guardado, o que mantém em português as matérias que atravessam
# de um dia para o outro.

on:
  schedule:
    # O agendador do GitHub enfileira tarefas agendadas e atrasa horas em
    # momentos de pico — foi o que fez a edição das 6h chegar às 14h. Duas
    # defesas contra isso:
    #
    #   1. os minutos são quebrados, porque a fila no minuto 0 é a pior;
    #   2. há três disparos na janela da manhã, e o trabalho de verdade
    #      acontece no primeiro que conseguir rodar. Os outros conferem que
    #      a edição do dia já existe e saem em segundos, sem gastar API.
    #
    # Horários em UTC. Brasília é UTC−3 e o Brasil não usa horário de verão;
    # se voltar a usar, tire uma hora de cada linha.
    - cron: '11 8 * * *'      # 05:11 em Brasília — coleta
    - cron: '41 9 * * *'      # 06:41 em Brasília — coleta
    - cron: '11 11 * * *'     # 08:11 em Brasília — coleta
    - cron: '26 10 * * 1,4'   # 07:26 em Brasília, segundas e quintas — coleta + tradução
  workflow_dispatch:
    inputs:
      tarefa:
        description: 'O que fazer agora'
        type: choice
        default: tudo
        options:
          - tudo          # coletar e traduzir o que estiver faltando
          - so-coleta     # só capturar o dia, sem gastar API

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

env:
  # Mantenha igual ao cron de tradução acima. O job 'decidir' compara as duas
  # strings para saber se este disparo é um dia de traduzir.
  CRON_TRADUCAO: '26 10 * * 1,4'

jobs:
  # Decide o que há para fazer. Sai em segundos quando não há nada.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      coletar: ${{ steps.checar.outputs.coletar }}
      traduzir: ${{ steps.checar.outputs.traduzir }}
    steps:
      - uses: actions/checkout@v4

      - id: checar
        name: O que fazer nesta execução?
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          EVENTO='${{ github.event_name }}'
          AGENDA='${{ github.event.schedule }}'
          TAREFA='${{ github.event.inputs.tarefa }}'

          if [ "$EVENTO" != "schedule" ]; then
            COLETAR=sim
            if [ "$TAREFA" = "so-coleta" ]; then TRADUZIR=nao; else TRADUZIR=sim; fi
            echo "Execução manual (${TAREFA:-tudo})." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$AGENDA" = "$CRON_TRADUCAO" ]; then TRADUZIR=sim; else TRADUZIR=nao; fi
            if [ -f "site/data/dias/$HOJE.json" ]; then
              COLETAR=nao
              echo "A edição de **$HOJE** já foi publicada por um disparo anterior." >> "$GITHUB_STEP_SUMMARY"
            else
              COLETAR=sim
              echo "Ainda não há edição de $HOJE." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "coletar=$COLETAR"   >> "$GITHUB_OUTPUT"
          echo "traduzir=$TRADUZIR" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Coletar: **$COLETAR** · Traduzir: **$TRADUZIR**" >> "$GITHUB_STEP_SUMMARY"

  executar:
    needs: decidir
    if: needs.decidir.outputs.coletar == 'sim' || needs.decidir.outputs.traduzir == 'sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Coletar feeds
        if: needs.decidir.outputs.coletar == 'sim'
        run: node collector/collect.mjs
        env:
          WINDOW_HOURS: '48'
          PER_SOURCE_CAP: '25'
          GLOBAL_CAP: '700'

      # Sem a chave, o enrich só aplica a memória de traduções. É de graça e é
      # o que impede uma matéria traduzida ontem de voltar ao inglês hoje.
      - name: Aplicar as traduções já guardadas
        if: needs.decidir.outputs.traduzir != 'sim'
        run: node collector/enrich.mjs
        env:
          # Diz ao enrich que a ausência de chave aqui é de propósito, para a
          # linha do site não acusar "nenhuma chave configurada" sem motivo.
          MODO_APLICAR: '1'

      - name: Traduzir o que falta e escrever a análise do dia
        if: needs.decidir.outputs.traduzir == 'sim'
        run: node collector/enrich.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Varre uma semana para trás e preenche o que estiver sem tradução.
          DIAS_TRADUZIR: '7'
          # ESTE é o número que controla o custo: quantas matérias de cada dia
          # são traduzidas. A tradução começa pelas mais recentes, na mesma
          # ordem em que o site mostra, então 150 cobre bem mais do que se
          # costuma rolar num dia. Baixar para 80 corta o custo quase pela
          # metade; subir para 300 dobra.
          MAX_TRANSLATE_DIA: '150'
          # Válvula de segurança da execução inteira: 7 dias × 150 = 1050.
          # Precisa comportar a recuperação de uma semana de uma vez só.
          MAX_TRANSLATE_TOTAL: '1050'

      - name: Podar o acervo além de 30 dias
        run: node collector/prune.mjs
        env:
          KEEP_DAYS: '30'

      - name: Guardar a edição no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "Nada mudou nesta execução."
          else
            git commit -m "Edição de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Resumo
        run: |
          echo "### Edição publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Site: ${{ steps.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          node -e "
            const d = require('./site/data/latest.json');
            const l = [];
            l.push('- Matérias publicadas: **' + d.stats.publishedItems + '** (de ' + d.stats.rawItems + ' brutas)');
            l.push('- Fontes que responderam: **' + d.stats.sourcesOk + '/' + d.stats.sourcesTotal + '**');
            if (d.ai) {
              l.push('- Em português: **' + (d.ai.translatedCount || 0) + '**' +
                (d.ai.pendentes ? ' · ainda no original: **' + d.ai.pendentes + '**' : ' · nada pendente'));
              l.push('- Traduzidas nesta execução: **' + (d.ai.traduzidasAgora || 0) + '**' +
                (d.ai.models ? ' com \`' + d.ai.models.translate + '\`' : ' (sem chamadas de API)'));
              l.push('- Memória de traduções: **' + (d.ai.memoria || 0) + '** matéria(s)' +
                (d.ai.diasRegravados ? ' · ' + d.ai.diasRegravados + ' dia(s) do acervo atualizados' : ''));
              if (d.ai.models) {
                l.push('- Análise do dia: ' + (d.briefing
                  ? '**pronta** com \`' + (d.ai.models.briefingUsado || d.ai.models.briefing) + '\`'
                  : '**falhou** — ' + (d.briefingErro || 'motivo não registrado')));
              }
            }
            if (d.aiNote) l.push('- ' + d.aiNote);
            if (d.acervo) l.push('- Acervo: **' + d.acervo.dias.length + '** dia(s) guardado(s)');
            const down = d.sources.filter(s => !s.ok);
            if (down.length) {
              l.push('');
              l.push('<details open><summary><b>Fontes que falharam (' + down.length + ')</b></summary>');
              l.push('');
              down.forEach(s => l.push('- \`' + s.id + '\`: ' + s.error));
              l.push('');
              l.push('</details>');
            }
            const empty = d.sources.filter(s => s.ok && s.collected === 0);
            if (empty.length) {
              l.push('');
              l.push('<details open><summary><b>Responderam sem trazer nada (' + empty.length + ')</b></summary>');
              l.push('');
              l.push('| fonte | itens no feed | fora da janela | o que veio |');
              l.push('|---|---|---|---|');
              empty.forEach(s => {
                const g = s.diag || {};
                const amostra = (g.sample || '').replace(/\|/g, '/').slice(0, 90);
                l.push('| \`' + s.id + '\` | ' + (g.entries ?? '?') + ' | ' + (g.stale ?? '?') + ' | ' + amostra + ' |');
              });
              l.push('');
              l.push('</details>');
            }
            console.log(l.join('\n'));
          " >> $GITHUB_STEP_SUMMARY
